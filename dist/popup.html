<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 320px; font-family: sans-serif; padding: 12px; }
    textarea { width: 100%; height: 70px; box-sizing: border-box; }
    button { width: 100%; margin-top: 8px; padding: 8px; cursor: pointer; }
    pre { background: #f4f4f4; padding: 8px; white-space: pre-wrap; word-break: break-all; font-size: 12px; }
  </style>
</head>
<body>
  <h3>Gemini Extension</h3>
  <input type="password" id="apiKey" placeholder="Enter Gemini API Key" style="width:100%; margin-bottom:8px; padding:6px; box-sizing:border-box;">
  <select id="modelSelect" style="width:100%; margin-bottom:8px; padding:6px; box-sizing:border-box;">
    <option value="auto">Auto-Detect Best Available Model (Recommended)</option>
    <option value="gemini-2.0-flash">gemini-2.0-flash (Fast & Stable)</option>
    <option value="gemini-1.5-flash-latest">gemini-1.5-flash-latest</option>
    <option value="gemini-1.5-pro-latest">gemini-1.5-pro-latest</option>
    <option value="gemini-2.0-flash-lite-preview-02-05">gemini-2.0-flash-lite</option>
  </select>
  <textarea id="prompt">The quick brown fox jumps over the lazy dog.</textarea>
  <button id="runBtn">Run Prompt</button>
  
  <h4>Result</h4>
  <div id="output">Ready</div>

  <script src="popup.js"></script>
</body>
</html>
